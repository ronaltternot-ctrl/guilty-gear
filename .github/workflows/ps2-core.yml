name: Probar el núcleo de PS2

on:
  push:
    branches: [ ps2-core ]

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
      - name: Compilar PSX2
        run: |
          sudo apt-get install -y ninja-build > /dev/null || true
          bash scripts/build_ps2.sh "$RUNNER_TEMP/target"
          ls -la "$RUNNER_TEMP/target/android/extlibs/arm64-v8a" "$RUNNER_TEMP/target/android/src/com/izzy2lost/psx2"
          NDK_BIN="$(ls -d /usr/local/lib/android/sdk/ndk/*/toolchains/llvm/prebuilt/linux-x86_64/bin | sort -V | tail -n 1)"
          "$NDK_BIN/llvm-readelf" -d "$RUNNER_TEMP/target/android/extlibs/arm64-v8a/libemucore.so" | grep -i "needed\|soname"
          "$NDK_BIN/llvm-nm" -D --defined-only "$RUNNER_TEMP/target/android/extlibs/arm64-v8a/libemucore.so" | grep -c "Java_com_izzy2lost"
      - uses: actions/upload-artifact@v7
        with:
          name: ps2-core
          path: build/ps2-cache/*.tar
          retention-days: 5
