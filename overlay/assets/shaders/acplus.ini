# GGXX AC+ launcher build: extra post-processing shaders.
# All of them only process the final picture; the game's sprites and textures are untouched.
# Each one is the first shader of its chain with Upscaling=True, so the game is rendered at
# its original 480x272 and the shader builds the full-resolution image.

[AcArcade]
Name=Arcade (monitor de recreativa)
Author=GGXX AC+ launcher
Fragment=acplus_crt_arcade.fsh
Vertex=fxaa.vsh
OutputResolution=True
Upscaling=True
SettingName1=Curvatura
SettingDefaultValue1=0.2
SettingMinValue1=0.0
SettingMaxValue1=1.0
SettingStep1=0.05
SettingName2=Scanlines
SettingDefaultValue2=0.8
SettingMinValue2=0.0
SettingMaxValue2=1.0
SettingStep2=0.05
SettingName3=Mascara RGB
SettingDefaultValue3=0.35
SettingMinValue3=0.0
SettingMaxValue3=1.0
SettingStep3=0.05
SettingName4=Brillo (glow)
SettingDefaultValue4=0.35
SettingMinValue4=0.0
SettingMaxValue4=1.0
SettingStep4=0.05

[AcCrtTv]
Name=CRT (televisor de tubo)
Author=GGXX AC+ launcher
Fragment=acplus_crt_tv.fsh
Vertex=fxaa.vsh
OutputResolution=True
Upscaling=True
SettingName1=Curvatura
SettingDefaultValue1=0.6
SettingMinValue1=0.0
SettingMaxValue1=1.0
SettingStep1=0.05
SettingName2=Scanlines
SettingDefaultValue2=0.6
SettingMinValue2=0.0
SettingMaxValue2=1.0
SettingStep2=0.05
SettingName3=Mascara de puntos
SettingDefaultValue3=0.45
SettingMinValue3=0.0
SettingMaxValue3=1.0
SettingStep3=0.05
SettingName4=Brillo (glow)
SettingDefaultValue4=0.5
SettingMinValue4=0.0
SettingMaxValue4=1.0
SettingStep4=0.05

[AcScanlines]
Name=Scanlines (pixeles nitidos)
Author=GGXX AC+ launcher
Fragment=acplus_scanlines.fsh
Vertex=fxaa.vsh
OutputResolution=True
Upscaling=True
SettingName1=Intensidad
SettingDefaultValue1=0.6
SettingMinValue1=0.0
SettingMaxValue1=1.0
SettingStep1=0.05
SettingName2=Grosor de linea
SettingDefaultValue2=0.5
SettingMinValue2=0.0
SettingMaxValue2=1.0
