# NNEDI3 neural-network upscaler as post-processing: 480x272 -> 960x544 -> screen.
# Pick "AcNnedi3" (or "AcNnedi3Rgb"); the Parent keys pull in the earlier passes.
[AcNnedi3V]
Name=NNEDI3 paso 1
Fragment=acplus_nnedi3_v.fsh
Vertex=fxaa.vsh
Upscaling=True
Visible=False

[AcNnedi3H]
Name=NNEDI3 paso 2
Parent=AcNnedi3V
Fragment=acplus_nnedi3_h.fsh
Vertex=fxaa.vsh
SSAA=2
Visible=False

[AcNnedi3]
Name=IA: NNEDI3 (red neuronal)
Author=tritical, mpv-prescalers; GGXX AC+ launcher
Parent=AcNnedi3H
Fragment=acplus_upscale_final.fsh
Vertex=fxaa.vsh
OutputResolution=True

[AcNnedi3RgbV]
Name=NNEDI3 RGB paso 1
Fragment=acplus_nnedi3_rgb_v.fsh
Vertex=fxaa.vsh
Upscaling=True
Visible=False

[AcNnedi3RgbH]
Name=NNEDI3 RGB paso 2
Parent=AcNnedi3RgbV
Fragment=acplus_nnedi3_rgb_h.fsh
Vertex=fxaa.vsh
SSAA=2
Visible=False

[AcNnedi3Rgb]
Name=IA: NNEDI3 RGB (maxima calidad)
Author=tritical, mpv-prescalers; GGXX AC+ launcher
Parent=AcNnedi3RgbH
Fragment=acplus_upscale_final.fsh
Vertex=fxaa.vsh
OutputResolution=True

# AMD FidelityFX Super Resolution 1.0 (MIT license, Advanced Micro Devices, Inc.).
# Unlike the shaders above, the game keeps the internal resolution chosen in the launcher:
# EASU outputs its input times "Scale" (OutputScaleSetting, patches/0005), up to the size of
# the game on screen, and RCAS sharpens that at the same size.
[AcXbrSprites]
Name=xBR para sprites (antes de AMD FSR)
Author=Hyllian (5xBR lv2, tweak by guest.r)
Fragment=5xBR-lv2.fsh
Vertex=5xBR.vsh
# The game is drawn at 480x272 (Upscaling) and this pass doubles it, rounding the sprites' edges;
# then FSR scales it to the screen.
Upscaling=True
OutputScaleSetting=1
SettingName1=Scale
SettingDefaultValue1=2.0
SettingMinValue1=2.0
SettingMaxValue1=2.0
SettingStep1=1.0

[AcFsrEasu]
Name=AMD FSR 1.0 EASU (escalado)
Author=Advanced Micro Devices, Inc. (MIT)
Fragment=acplus_fsr1_easu.fsh
Vertex=fxaa.vsh
OutputScaleSetting=1
SettingName1=Scale
SettingDefaultValue1=2.0
SettingMinValue1=1.0
SettingMaxValue1=4.0
SettingStep1=0.5

[AcFsrRcas]
Name=AMD FSR 1.0 RCAS (nitidez)
Author=Advanced Micro Devices, Inc. (MIT)
Fragment=acplus_fsr1_rcas.fsh
Vertex=fxaa.vsh
SettingName1=Sharpness
SettingDefaultValue1=0.85
SettingMinValue1=0.0
SettingMaxValue1=1.0
SettingStep1=0.05

[AcFsrFinish]
Name=AMD CAS (detalle) y color
Author=Advanced Micro Devices, Inc. (MIT)
Fragment=acplus_fsr1_finish.fsh
Vertex=fxaa.vsh
SettingName1=Detail
SettingDefaultValue1=0.5
SettingMinValue1=0.0
SettingMaxValue1=1.0
SettingStep1=0.05
SettingName2=Color
SettingDefaultValue2=0.3
SettingMinValue2=0.0
SettingMaxValue2=1.0
SettingStep2=0.05
