# GGXX AC+ launcher build: extra post-processing shaders.
# All of them only process the final picture; the game's sprites and textures are untouched.
# Each one is the first shader of its chain with Upscaling=True, so the game is rendered at
# its original 480x272 and the shader builds the full-resolution image.

[AcArcade]
Name=Arcade (monitor de recreativa)
Author=GGXX AC+ launcher
Fragment=acplus_crt_arcade.fsh
Vertex=fxaa.vsh
OutputResolution=True
Upscaling=True
SettingName1=Curvatura
SettingDefaultValue1=0.2
SettingMinValue1=0.0
SettingMaxValue1=1.0
SettingStep1=0.05
SettingName2=Scanlines
SettingDefaultValue2=0.8
SettingMinValue2=0.0
SettingMaxValue2=1.0
SettingStep2=0.05
SettingName3=Mascara RGB
SettingDefaultValue3=0.35
SettingMinValue3=0.0
SettingMaxValue3=1.0
SettingStep3=0.05
SettingName4=Brillo (glow)
SettingDefaultValue4=0.35
SettingMinValue4=0.0
SettingMaxValue4=1.0
SettingStep4=0.05

[AcCrtTv]
Name=CRT (televisor de tubo)
Author=GGXX AC+ launcher
Fragment=acplus_crt_tv.fsh
Vertex=fxaa.vsh
OutputResolution=True
Upscaling=True
SettingName1=Curvatura
SettingDefaultValue1=0.6
SettingMinValue1=0.0
SettingMaxValue1=1.0
SettingStep1=0.05
SettingName2=Scanlines
SettingDefaultValue2=0.6
SettingMinValue2=0.0
SettingMaxValue2=1.0
SettingStep2=0.05
SettingName3=Mascara de puntos
SettingDefaultValue3=0.45
SettingMinValue3=0.0
SettingMaxValue3=1.0
SettingStep3=0.05
SettingName4=Brillo (glow)
SettingDefaultValue4=0.5
SettingMinValue4=0.0
SettingMaxValue4=1.0
SettingStep4=0.05

[AcScanlines]
Name=Scanlines (pixeles nitidos)
Author=GGXX AC+ launcher
Fragment=acplus_scanlines.fsh
Vertex=fxaa.vsh
OutputResolution=True
Upscaling=True
SettingName1=Intensidad
SettingDefaultValue1=0.6
SettingMinValue1=0.0
SettingMaxValue1=1.0
SettingStep1=0.05
SettingName2=Grosor de linea
SettingDefaultValue2=0.5
SettingMinValue2=0.0
SettingMaxValue2=1.0
SettingStep2=0.05
SettingName3=Brillo
SettingDefaultValue3=1.0
SettingMinValue3=0.5
SettingMaxValue3=1.5
SettingStep3=0.05

# NNEDI3 neural-network upscaler as post-processing: 480x272 -> 960x544 -> screen.
# Pick "AcNnedi3" (or "AcNnedi3Rgb"); the Parent keys pull in the earlier passes.
[AcNnedi3V]
Name=NNEDI3 paso 1
Fragment=acplus_nnedi3_v.fsh
Vertex=fxaa.vsh
Upscaling=True
Visible=False

[AcNnedi3H]
Name=NNEDI3 paso 2
Parent=AcNnedi3V
Fragment=acplus_nnedi3_h.fsh
Vertex=fxaa.vsh
SSAA=2
Visible=False

[AcNnedi3]
Name=IA: NNEDI3 (red neuronal)
Author=tritical, mpv-prescalers; GGXX AC+ launcher
Parent=AcNnedi3H
Fragment=acplus_upscale_final.fsh
Vertex=fxaa.vsh
OutputResolution=True

[AcNnedi3RgbV]
Name=NNEDI3 RGB paso 1
Fragment=acplus_nnedi3_rgb_v.fsh
Vertex=fxaa.vsh
Upscaling=True
Visible=False

[AcNnedi3RgbH]
Name=NNEDI3 RGB paso 2
Parent=AcNnedi3RgbV
Fragment=acplus_nnedi3_rgb_h.fsh
Vertex=fxaa.vsh
SSAA=2
Visible=False

[AcNnedi3Rgb]
Name=IA: NNEDI3 RGB (maxima calidad)
Author=tritical, mpv-prescalers; GGXX AC+ launcher
Parent=AcNnedi3RgbH
Fragment=acplus_upscale_final.fsh
Vertex=fxaa.vsh
OutputResolution=True
